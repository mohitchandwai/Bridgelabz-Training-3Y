<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pricing</title>
<link rel="stylesheet" href="05_pricing.css">
</head>
<body>
  <main class="pricing">
    <h1>Pricing Plans</h1>
    <section class="plans">
      <div class="plan">
        <h2>Basic</h2>
        <ul>
          <li>Feature A</li>
          <li>Feature B</li>
        </ul>
        <div class="price">₹499</div>
        <a href="#" class="btn">Choose</a>
      </div>

      <div class="plan popular">
        <h2>Standard</h2>
        <ul>
          <li>Everything in Basic</li>
          <li>Feature C</li>
        </ul>
        <div class="price">₹999</div>
        <a href="#" class="btn">Choose</a>
      </div>

      <div class="plan">
        <h2>Premium</h2>
        <ul>
          <li>All features</li>
          <li>Priority support</li>
        </ul>
        <div class="price">₹1999</div>
        <a href="#" class="btn">Choose</a>
      </div>
    </section>
  </main>
</body>
</html>
