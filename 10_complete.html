<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Complete Layout</title>
<link rel="stylesheet" href="10_complete.css">
</head>
<body>
  <header class="topnav">
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Welcome to Our Site</h1>
      <p>Modern responsive layout with precise box model use.</p>
    </div>
  </section>

  <section class="about">
    <div class="about-text">
      <h2>About Us</h2>
      <p>Some text about the company.</p>
    </div>
    <div class="about-img">
      <img src="images/about.jpg" alt="">
    </div>
  </section>

  <section class="services">
    <div class="service">Service A</div>
    <div class="service">Service B</div>
    <div class="service">Service C</div>
  </section>

  <section class="contact">
    <form>
      <input type="text" placeholder="Your name">
      <input type="email" placeholder="Email">
      <button>Send</button>
    </form>
  </section>

  <footer class="footer">&copy; 2025 Company</footer>
</body>
</html>
